name: Gerar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ver ficheiros do repositorio
        run: ls -la
      - name: Preparar projeto
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            F=$(ls *.html 2>/dev/null | head -n 1)
            if [ -n "$F" ]; then cp "$F" www/index.html; fi
          fi
          test -f www/index.html || { echo "ERRO - falta o ficheiro index.html (a app) no repositorio"; exit 1; }
          test -f package.json || { echo "ERRO - falta o ficheiro package.json no repositorio"; exit 1; }
          echo '{"appId":"com.eusoumelhor.agenda","appName":"Eu sou o melhor","webDir":"www"}' > capacitor.config.json
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Adicionar permissoes de alarmes e notificacoes
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM VIBRATE RECEIVE_BOOT_COMPLETED WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#</manifest># <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$M"
          done
          grep uses-permission "$M"
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-melhor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
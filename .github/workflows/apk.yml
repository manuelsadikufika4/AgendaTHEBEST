name: Gerar APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ver ficheiros do repositorio
        run: ls -la
      - name: Preparar projeto
        run: |
          mkdir -p www
          # O Android distingue maiusculas de minusculas: o ficheiro tem de se chamar index.html
          if [ -f www/Index.html ]; then
            if [ ! -s www/index.html ]; then cp www/Index.html www/index.html; fi
            rm -f www/Index.html
          fi
          test -s www/index.html || { echo "ERRO - www/index.html nao existe ou esta vazio"; exit 1; }
          test -f package.json || { echo "ERRO - falta o ficheiro package.json no repositorio"; exit 1; }
          echo "index.html tem $(wc -c < www/index.html) bytes"
      - name: Instalar dependencias
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Adicionar permissoes de alarmes e notificacoes
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM VIBRATE RECEIVE_BOOT_COMPLETED WAKE_LOCK; do
            grep -q "android.permission.$P\"" "$M" || sed -i "s#</manifest># <uses-permission android:name=\"android.permission.$P\" />\n</manifest>#" "$M"
          done
          grep uses-permission "$M"
      - name: Sincronizar
        run: npx cap sync android
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: agenda-melhor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk